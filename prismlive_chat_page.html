<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal 1-to-1 Chat Application</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS styling block for clean transitions and layouts -->
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
        }

        /* Custom smooth scrollbars */
        ::-webkit-scrollbar { 
            width: 5px; 
        }
        ::-webkit-scrollbar-track { 
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb { 
            background: #195db1; 
            border-radius: 9999px; 
        }
        ::-webkit-scrollbar-thumb:hover { 
            background: #5884c2; 
        }

        /* Smooth fade-in & slide-up animations for messages */
        @keyframes messageSlideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-message {
            animation: messageSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Subtle background glow wrapper */
        .chat-app-wrapper {
            background: linear-gradient(135deg, #0a5197 0%, #7ba8d4 100%);
        }
    </style>
</head>
<body class="h-full chat-app-wrapper text-slate-800 flex flex-col justify-center items-center p-0 sm:p-4">

    <!-- MAIN APP CONTAINER -->
    <div id="app" class="w-full h-full sm:h-[92vh] sm:max-w-4xl bg-white sm:rounded-2xl sm:shadow-2xl flex flex-col overflow-hidden border border-slate-200/80">
        
        <!-- HEADER -->
        <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 px-6 py-4 flex items-center justify-between shrink-0 z-10">
            <div class="flex items-center space-x-3">
                <div class="relative">
                    <div id="user-avatar" class="w-11 h-11 rounded-full bg-indigo-600 text-white font-semibold flex items-center justify-center text-sm shadow-md shadow-indigo-100">U</div>
                    <span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-500 border-2 border-white rounded-full"></span>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 id="header-username" class="font-semibold text-slate-900 leading-tight">Connecting...</h1>
                        <span class="bg-indigo-50 text-indigo-600 text-[10px] font-semibold px-2 py-0.5 rounded-full border border-indigo-100/50">You</span>
                    </div>
                    <p class="text-xs text-emerald-600 font-medium flex items-center gap-1.5 mt-0.5">
                        <!-- <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span id="connection-status">Online</span> -->
                    </p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="changeUsername()" title="Change Username" class="text-xs font-medium text-slate-600 hover:text-indigo-600 bg-slate-100 hover:bg-indigo-50 px-3.5 py-2 rounded-xl transition-all border border-slate-200/60 flex items-center gap-1.5">
                    <!-- <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg> -->
                    <!-- <span>Edit Name</span> -->
                </button>
            </div>
        </header>


        
        <!-- CHAT MESSAGES BODY -->
        <main id="chat-container" class="flex-1 overflow-y-auto p-6 space-y-4 bg-slate-50/40 flex flex-col">
            <!-- Welcome placeholder rendered dynamically if empty -->
        </main>

        <!-- FOOTER / INPUT AREA -->
        <footer class="bg-white border-t border-slate-100 p-4 shrink-0">
            <form id="chat-form" onsubmit="handleSendMessage(event)" class="flex items-center gap-3">
                <div class="relative flex-1">
                    <input 
                        type="text" 
                        id="message-input" 
                        placeholder="Type your message here..." 
                        autocomplete="off"
                        required
                        class="w-full bg-slate-100/80 border border-slate-200/60 focus:border-indigo-500 focus:bg-white text-slate-800 text-sm rounded-xl px-4 py-3.5 outline-none transition-all placeholder:text-slate-400 shadow-inner"
                    >
                </div>
                <button 
                    type="submit" 
                    class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-medium px-5 py-3.5 rounded-xl transition-all shadow-md shadow-indigo-200 hover:shadow-lg flex items-center justify-center shrink-0">
                    <svg class="w-5 h-5 rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                </button>
            </form>
        </footer>

    </div>

    <script>
        // State Management
        let username = localStorage.getItem('chat_username') || ('User_' + Math.floor(1000 + Math.random() * 9000));
        localStorage.setItem('chat_username', username);

        const messages = JSON.parse(localStorage.getItem('chat_messages') || '[]');
        
        // Initialize BroadcastChannel to simulate WebSocket server communication seamlessly across browser tabs
        const chatChannel = new BroadcastChannel('minimal_chat_sync_channel');

        // DOM elements
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const headerUsername = document.getElementById('header-username');
        const userAvatar = document.getElementById('user-avatar');

        // Setup user interface on page load
        window.onload = function() {
            headerUsername.textContent = username;
            userAvatar.textContent = username.charAt(0).toUpperCase();
            renderMessages();

            // Notify channel about user presence
            broadcastEvent({ type: 'JOIN', username: username, timestamp: Date.now() });
        };

        // Broadcast messages or events
        function broadcastEvent(data) {
            chatChannel.postMessage(data);
        }

        // Listen for messages from other tabs (simulating WebSocket server broadcast)
        chatChannel.onmessage = function(event) {
            const data = event.data;
            if (data.type === 'MESSAGE') {
                messages.push(data.payload);
                saveAndRender();
            } else if (data.type === 'JOIN') {
                showSystemNotification(`${data.username} joined the session.`);
            }
        };

        // Handle sending messages
        function handleSendMessage(e) {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            const messageObj = {
                id: 'msg_' + Date.now() + Math.random(),
                username: username,
                text: text,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            // Push locally
            messages.push(messageObj);
            saveAndRender();

            // Broadcast to other tabs/peers
            broadcastEvent({ type: 'MESSAGE', payload: messageObj });

            // Clear input
            messageInput.value = '';
            messageInput.focus();
        }

        // Save messages and update UI
        function saveAndRender() {
            localStorage.setItem('chat_messages', JSON.stringify(messages));
            renderMessages();
        }

        // Render message stream
        function renderMessages() {
            if (messages.length === 0) {
                chatContainer.innerHTML = `
                    <div class="my-auto text-center py-8">
                        <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-3 shadow-sm border border-indigo-100/60">
                            💬
                        </div>
                        <h3 class="text-base font-semibold text-slate-700">Welcome to Minimal Chat</h3>
                        <p class="text-sm text-slate-400 max-w-sm mx-auto mt-1">Open a second browser tab to test real-time 1-to-1 messaging instantly. Have fun!</p>
                    </div>
                `;
                return;
            }

            let html = '';
            messages.forEach((msg) => {
                const isMe = msg.username === username;
                if (isMe) {
                    html += `
                        <div class="flex flex-col items-end space-y-1 animate-message">
                            <div class="flex items-end space-x-2 max-w-[85%] sm:max-w-[70%]">
                                <div class="bg-indigo-600 text-white rounded-2xl rounded-tr-sm px-4 py-3 shadow-sm text-sm break-words leading-relaxed">
                                    ${escapeHtml(msg.text)}
                                </div>
                            </div>
                            <span class="text-[10px] text-slate-400 px-1 font-medium">${msg.timestamp}</span>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="flex flex-col items-start space-y-1 animate-message">
                            <span class="text-xs font-semibold text-slate-500 px-1">${escapeHtml(msg.username)}</span>
                            <div class="flex items-end space-x-2 max-w-[85%] sm:max-w-[70%]">
                                <div class="bg-white border border-slate-200/60 text-slate-800 rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm text-sm break-words leading-relaxed">
                                    ${escapeHtml(msg.text)}
                                </div>
                            </div>
                            <span class="text-[10px] text-slate-400 px-1 font-medium">${msg.timestamp}</span>
                        </div>
                    `;
                }
            });

            chatContainer.innerHTML = html;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Show toast or notification in chat stream
        function showSystemNotification(text) {
            const notif = document.createElement('div');
            notif.className = 'mx-auto my-2 px-3.5 py-1 bg-slate-200/70 text-slate-600 rounded-full text-xs font-medium animate-message shadow-sm';
            notif.textContent = text;
            chatContainer.appendChild(notif);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Change username interaction
        function changeUsername() {
            const newName = prompt('Enter your new display name:', username);
            if (newName && newName.trim() !== '') {
                username = newName.trim();
                localStorage.setItem('chat_username', username);
                headerUsername.textContent = username;
                userAvatar.textContent = username.charAt(0).toUpperCase();
                showSystemNotification(`You changed your name to ${username}`);
            }
        }

        // Prevent XSS injection for safe text rendering
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
